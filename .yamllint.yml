---
extends: default

locale: en_US.UTF-8

yaml-files:
  - '*.yaml'
  - '*.yml'
  - '.yamllint'

ignore: |
  .claude/
  graphify-out/
  node_modules/
  pnpm-lock.yaml
rules:
  comments:
    # prettier formats YAML with a single space before an inline comment.
    min-spaces-from-content: 1
  document-start:
    level: error
  document-end:
    level: error
  empty-values:
    level: error
  indentation:
    spaces: 2
    check-multi-line-strings: true
  line-length:
    max: 120
  octal-values: enable
  truthy:
    check-keys: false
...
